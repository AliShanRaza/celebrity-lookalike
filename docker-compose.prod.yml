version: '3.8'

services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: celebrity_lookalike_api_prod
    restart: always
    user: "10001:10001"
    read_only: false
    ports:
      - "8000:8000"
    env_file:
      - .env.production
    volumes:
      # Read-only model weights volume mount
      - ./models:/models:ro
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: celebrity_lookalike_worker_prod
    restart: always
    user: "10001:10001"
    env_file:
      - .env.production
    volumes:
      - ./models:/models:ro
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    command: python -m app.services.worker

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: celebrity_lookalike_web_prod
    restart: always
    user: "1001:1001"
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.yourdomain.com}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
